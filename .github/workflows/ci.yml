name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-helper:
    name: Build the iOS helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: swift test --package-path native/ios-helper

      - run: npm run build:ios-helper

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-helper
          path: assets/ios-helper/reflect-sim-helper
          if-no-files-found: error

  build:
    name: Build and test (${{ matrix.os }})
    needs: ios-helper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run coverage

      - run: npm run fetch-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - uses: actions/download-artifact@v8.0.2
        with:
          name: ios-helper
          path: assets/ios-helper/

      - if: runner.os != 'Windows'
        run: chmod +x assets/ios-helper/reflect-sim-helper

      - run: npx vsce package --out reflect-android.vsix

      - name: Check that the VSIX contains the iOS helper
        if: runner.os != 'Windows'
        run: unzip -l reflect-android.vsix | grep -q 'extension/assets/ios-helper/reflect-sim-helper'

      - name: Check that the iOS helper is executable in the VSIX
        if: runner.os != 'Windows'
        run: zipinfo reflect-android.vsix extension/assets/ios-helper/reflect-sim-helper | grep -q '^-rwx'

      - name: Check that the VSIX contains the iOS helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path reflect-android.vsix))
          $found = $zip.Entries | Where-Object FullName -eq 'extension/assets/ios-helper/reflect-sim-helper'
          $zip.Dispose()
          if (-not $found) { throw 'reflect-sim-helper is missing from the VSIX' }

      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage/

      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reflect-android-vsix
          path: reflect-android.vsix

  codecov:
    name: Upload coverage
    needs: build
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-report
          path: coverage/

      - if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
