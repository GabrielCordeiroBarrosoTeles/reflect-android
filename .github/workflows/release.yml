name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ios-helper:
    name: Build the iOS helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: swift test --package-path native/ios-helper

      - run: npm run build:ios-helper

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-helper
          path: assets/ios-helper/reflect-sim-helper
          if-no-files-found: error

  release:
    needs: ios-helper
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm run typecheck

      - run: npm run coverage

      - run: npm run fetch-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8.0.2
        with:
          name: ios-helper
          path: assets/ios-helper/

      - if: runner.os != 'Windows'
        run: chmod +x assets/ios-helper/reflect-sim-helper

      - run: npx vsce package --out "reflect-android-${GITHUB_REF_NAME}.vsix"

      - name: Check that the VSIX contains the iOS helper
        run: unzip -l "reflect-android-${GITHUB_REF_NAME}.vsix" | grep -q 'extension/assets/ios-helper/reflect-sim-helper'

      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: reflect-android-${{ github.ref_name }}.vsix
          generate_release_notes: true

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "reflect-android-${GITHUB_REF_NAME}.vsix"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "reflect-android-${GITHUB_REF_NAME}.vsix"
